name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Electron end-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

  package-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg rpm xvfb
      - run: npm ci
      - run: npm run package:linux
      - name: Smoke-test packaged application
        run: xvfb-run -a npm run test:e2e:packaged:linux
      - uses: actions/upload-artifact@v7
        with:
          name: sessionscribe-linux-x64
          path: release/*

  package-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: choco install ffmpeg --yes --no-progress
      - run: npm ci
      - run: npm run package:win
      - uses: actions/upload-artifact@v7
        with:
          name: sessionscribe-windows-x64
          path: release/*
