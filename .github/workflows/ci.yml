name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Electron end-to-end tests
        run: xvfb-run -a npm run test:e2e

  package-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg rpm xvfb
      - run: npm ci
      - run: npm run package:linux
      - name: Smoke-test packaged application
        run: xvfb-run -a npm run test:e2e:packaged:linux
      - uses: actions/upload-artifact@v7
        with:
          name: sessionscribe-linux-x64
          path: release/*
